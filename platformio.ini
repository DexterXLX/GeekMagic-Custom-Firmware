; Two firmware files are built:
;   SmallTV-Installer.bin  small (~350 KB), fits through the stock updater's ~524 KB limit
;   SmallTV-Modern.bin     the full firmware, installed from the installer's page
; Build both with:  pio run
; Pin numbers below are UNVERIFIED for your unit - see README.

[env]
platform = espressif8266@^4.2.1
board = esp12e
framework = arduino
board_build.filesystem = littlefs
; Flash layout read from the stock firmware: 4 MB, filesystem starts at 0x100000 (3 MB, "4m3m").
; Matching it means the stock files stay where this firmware expects them, and nothing overlaps.
board_build.ldscript = eagle.flash.4m3m.ld
; stock header says DIO, 40 MHz, 4 MB
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.f_cpu = 160000000L
extra_scripts = post:copy_bin.py
monitor_speed = 115200
upload_speed = 460800

[env:installer]
build_src_filter = -<*> +<installer.cpp>
lib_deps =
  bblanchon/ArduinoJson@^7.0.4

[env:smalltv]
build_src_filter = +<*> -<installer.cpp>
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bitbank2/AnimatedGIF@^2.1.1
  bblanchon/ArduinoJson@^7.0.4
  knolleary/PubSubClient@^2.8
build_flags =
  ; --- TFT_eSPI setup (replaces User_Setup.h) ---
  -DUSER_SETUP_LOADED=1
  -DST7789_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=240
  -DTFT_MISO=-1
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=-1
  -DTFT_DC=0
  -DTFT_RST=2
  -DSPI_FREQUENCY=40000000
  ; only the tiny built-in font is kept; the UI uses its own fonts (src/fonts.h)
  -DLOAD_GLCD=1
  ; --- optional: uncomment to use HTTPS for weather (costs ~20 KB RAM) ---
  ; -DWEATHER_HTTPS=1
